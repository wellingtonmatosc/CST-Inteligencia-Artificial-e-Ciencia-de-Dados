[project]
name = "gamificacao-qr-evento"
version = "0.1.0"
description = "Sistema web acessível de gamificação por QR Codes para evento acadêmico"
requires-python = ">=3.12"

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

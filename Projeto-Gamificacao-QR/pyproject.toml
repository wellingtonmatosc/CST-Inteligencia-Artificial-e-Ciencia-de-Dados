[project]
name = "gamificacao-qr-evento"
version = "0.1.0"
description = "Sistema web acessível de gamificação por QR Codes para evento acadêmico"
requires-python = "~=3.12.0"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "qrcode[pil]==8.2",
    "argon2-cffi==25.1.0",
    "itsdangerous==2.2.0",
    "tzdata==2026.2",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Desafio QR — IA e Ciência de Dados</title>
<link rel="stylesheet" href="/static/css/styles.css">
<style>
  .home-shell{max-width:680px}
  .compact-hero{display:block;background:transparent;box-shadow:none;padding:4px 2px 10px;margin:0}
  .compact-hero::after{display:none}
  .compact-hero h1{font-size:clamp(2rem,7vw,3rem);margin-bottom:4px}
  .compact-hero p{margin:0;color:var(--muted);font-size:1rem}
  .quick-tools{display:flex;justify-content:flex-end;gap:8px;margin:0 0 10px}
  .quick-tools button{width:auto;min-height:40px;padding:8px 12px}
  .home-auth{display:grid;gap:10px}
  .home-auth>.card{margin:0}
  .home-auth h2,.qr-scanner-card h2{margin-bottom:10px}
  .home-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .home-actions .text-link{grid-column:1/-1;text-align:center;padding:7px;text-decoration:none}
  .home-actions button.secondary{border:0}
  .home-panel[hidden],.qr-panel[hidden]{display:none!important}
  .panel-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
  .panel-actions .secondary{width:auto;min-width:96px;border:0}
  .qr-reader-wrap{margin-top:10px;padding:6px;border-radius:12px;background:#080d18}
  #qr-reader{width:100%;overflow:hidden;border-radius:10px}
  #qr-reader video{border-radius:10px}
  .qr-status{margin:8px 0 0;color:var(--muted);text-align:center}
  .qr-manual{margin-top:12px}
  .qr-manual-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
  .qr-manual-row button{width:auto;min-width:90px}
  .qr-close{margin-top:10px}
  .profile-card{margin-top:0}
  @media(max-width:640px){
    main.home-shell{width:min(100% - 20px,680px)}
    .quick-tools{justify-content:stretch}
    .quick-tools button{flex:1}
    .home-actions{grid-template-columns:1fr}
    .home-actions .text-link{grid-column:auto}
    .panel-actions,.qr-manual-row{grid-template-columns:1fr}
    .panel-actions .secondary,.qr-manual-row button{width:100%}
    .grid.two.compact-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<main id="conteudo" class="home-shell">
<header class="hero compact-hero">
  <h1>Desafio QR</h1>
  <p>Entre para continuar.</p>
</header>

<div class="quick-tools" aria-label="Áudio e acessibilidade">
  <button id="readPageQuick" type="button" class="secondary compact">Ouvir tela</button>
  <button id="openAccessibilityQuick" type="button" class="secondary compact">Acessibilidade</button>
</div>

<div id="message" class="notice hidden" role="status" aria-live="polite"></div>
<section id="profile" class="card profile-card hidden" aria-live="polite"></section>

<section id="forms" class="home-auth">
  <section id="loginSection" class="card auth-card" aria-labelledby="loginTitle">
    <h2 id="loginTitle">Entrar</h2>
    <form id="loginForm">
      <label for="login_nick">Nick</label>
      <input id="login_nick" name="nick" autocomplete="username" required minlength="3" maxlength="24" placeholder="Seu nick">

      <label for="login_pin">PIN</label>
      <input id="login_pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required placeholder="••••">

      <button type="submit">Entrar</button>
    </form>

    <div class="home-actions" aria-label="Outras opções">
      <button id="showRegister" type="button" class="secondary" aria-expanded="false" aria-controls="registerSection">Criar conta</button>
      <button id="showRecovery" type="button" class="secondary" aria-expanded="false" aria-controls="recoverSection">Recuperar acesso</button>
      <a class="text-link" href="/ranking">Ranking</a>
    </div>
  </section>

  <section id="registerSection" class="card auth-card home-panel" aria-labelledby="registerTitle" hidden>
    <h2 id="registerTitle">Criar conta</h2>
    <form id="registerForm">
      <label for="full_name">Nome completo</label>
      <input id="full_name" name="full_name" autocomplete="name" required minlength="3">

      <label for="nick">Nick no ranking</label>
      <input id="nick" name="nick" autocomplete="username" required minlength="3" maxlength="24">

      <div class="grid two compact-grid">
        <div><label for="pin">PIN de 4 dígitos</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required placeholder="••••"></div>
        <div><label for="pin_confirm">Confirmar PIN</label><input id="pin_confirm" name="pin_confirm" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required placeholder="••••"></div>
      </div>

      <label for="participant_type">Participante</label>
      <select id="participant_type" name="participant_type" required>
        <option value="student">Aluno IFMT</option>
        <option value="staff">Servidor IFMT</option>
        <option value="external">Público externo</option>
      </select>

      <div id="studentFields">
        <label for="registration">Matrícula</label><input id="registration" name="registration">
        <label for="course_class">Curso / turma</label><input id="course_class" name="course_class">
      </div>

      <div id="externalFields" class="hidden">
        <label for="institution">Instituição / empresa <span class="muted">(opcional)</span></label>
        <input id="institution" name="institution">
      </div>

      <div class="panel-actions">
        <button type="submit">Criar conta</button>
        <button id="backFromRegister" type="button" class="secondary">Voltar</button>
      </div>
    </form>
  </section>

  <section id="recoverSection" class="card home-panel" aria-labelledby="recoverTitle" hidden>
    <h2 id="recoverTitle">Recuperar acesso</h2>
    <form id="recoverForm">
      <label for="access_code">Código de recuperação</label>
      <input id="access_code" name="access_code" autocomplete="off" required>

      <div class="grid two compact-grid">
        <div><label for="recovery_pin">Novo PIN</label><input id="recovery_pin" name="new_pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required placeholder="••••"></div>
        <div><label for="recovery_pin_confirm">Confirmar PIN</label><input id="recovery_pin_confirm" name="new_pin_confirm" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required placeholder="••••"></div>
      </div>

      <div class="panel-actions">
        <button type="submit">Redefinir PIN</button>
        <button id="backFromRecovery" type="button" class="secondary">Voltar</button>
      </div>
    </form>
  </section>
</section>

<section id="qrScannerSection" class="card qr-scanner-card qr-panel" aria-labelledby="qrScannerTitle" hidden>
  <h2 id="qrScannerTitle">Ler QR Code</h2>
  <p class="muted">Aponte a câmera para o QR.</p>
  <div class="qr-reader-wrap"><div id="qr-reader" aria-label="Câmera para leitura do QR Code"></div></div>
  <p id="qrStatus" class="qr-status" role="status" aria-live="polite">Preparando câmera…</p>

  <div class="qr-manual">
    <form id="qrManualForm" class="qr-manual-row">
      <div>
        <label for="qrManualCode">Código do QR</label>
        <input id="qrManualCode" name="code" autocomplete="off" maxlength="100" placeholder="Ex.: TESTE-UI-A11Y" required>
      </div>
      <button type="submit" class="secondary">Abrir</button>
    </form>
  </div>

  <div class="qr-close"><button id="closeQrScanner" type="button" class="secondary">Fechar câmera</button></div>
</section>
</main>
<script src="/static/js/common.js"></script>
<script src="/static/js/index.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(() => {
  const login = document.querySelector('#loginSection');
  const register = document.querySelector('#registerSection');
  const recovery = document.querySelector('#recoverSection');
  const showRegister = document.querySelector('#showRegister');
  const showRecovery = document.querySelector('#showRecovery');
  const scannerSection = document.querySelector('#qrScannerSection');
  const closeScanner = document.querySelector('#closeQrScanner');
  const qrStatus = document.querySelector('#qrStatus');
  const manualForm = document.querySelector('#qrManualForm');
  let scanner = null;
  let running = false;
  let navigating = false;

  function focusFirst(panel){
    const field = panel.querySelector('input,select,button');
    if(field) field.focus({preventScroll:true});
  }

  function show(panel){
    login.hidden = panel !== login;
    register.hidden = panel !== register;
    recovery.hidden = panel !== recovery;
    showRegister.setAttribute('aria-expanded', String(panel === register));
    showRecovery.setAttribute('aria-expanded', String(panel === recovery));
    if(panel !== login){
      panel.scrollIntoView({behavior:'smooth',block:'start'});
      setTimeout(() => focusFirst(panel), 150);
    } else {
      document.querySelector('#login_nick')?.focus({preventScroll:true});
    }
  }

  showRegister.addEventListener('click', () => show(register));
  showRecovery.addEventListener('click', () => show(recovery));
  document.querySelector('#backFromRegister').addEventListener('click', () => show(login));
  document.querySelector('#backFromRecovery').addEventListener('click', () => show(login));
  document.querySelector('#openAccessibilityQuick').addEventListener('click', () => window.openAccessibilityPanel?.());
  document.querySelector('#readPageQuick').addEventListener('click', () => window.speakPage?.());

  function setQrStatus(text){qrStatus.textContent = text}

  function extractQrCode(value){
    const text = String(value || '').trim();
    if(!text) return null;
    try{
      const parsed = new URL(text, window.location.origin);
      const match = parsed.pathname.match(/^\/q\/([^/?#]+)\/?$/i);
      if(match) return decodeURIComponent(match[1]);
    }catch(_){ }
    if(/^[A-Za-z0-9_-]{2,100}$/.test(text)) return text;
    return null;
  }

  async function stopScanner(){
    if(scanner && running){
      try{ await scanner.stop(); }catch(_){ }
      running = false;
    }
  }

  async function goToQr(decodedText){
    if(navigating) return;
    const code = extractQrCode(decodedText);
    if(!code){setQrStatus('QR inválido.');return}
    navigating = true;
    setQrStatus('Abrindo desafio…');
    await stopScanner();
    window.location.assign(`/q/${encodeURIComponent(code)}`);
  }

  async function startScanner(){
    scannerSection.hidden = false;
    scannerSection.scrollIntoView({behavior:'smooth',block:'start'});
    setQrStatus('Solicitando câmera…');

    if(typeof window.Html5Qrcode === 'undefined'){
      setQrStatus('Câmera indisponível. Digite o código abaixo.');
      return;
    }

    try{
      if(!scanner) scanner = new Html5Qrcode('qr-reader');
      await scanner.start(
        {facingMode:'environment'},
        {fps:10,qrbox:{width:240,height:240},aspectRatio:1.0},
        decodedText => { goToQr(decodedText); },
        () => {}
      );
      running = true;
      setQrStatus('Câmera ativa.');
    }catch(_){
      running = false;
      setQrStatus('Não foi possível abrir a câmera. Digite o código abaixo.');
    }
  }

  async function closeQr(restoreFocus=true){
    await stopScanner();
    scannerSection.hidden = true;
    setQrStatus('Preparando câmera…');
    if(restoreFocus) document.querySelector('#openQrScanner')?.focus({preventScroll:true});
  }

  document.addEventListener('click', event => {
    if(event.target.closest('#openQrScanner')) startScanner();
    if(event.target.closest('#logoutButton')){
      closeQr(false);
      show(login);
    }
  });

  closeScanner.addEventListener('click', () => closeQr(true));
  manualForm.addEventListener('submit', event => {
    event.preventDefault();
    goToQr(new FormData(manualForm).get('code'));
  });

  document.addEventListener('visibilitychange', () => {
    if(document.hidden && running) stopScanner();
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827">
<title>Trilhas Poéticas — IFMT</title>
<link rel="stylesheet" href="/static/css/styles.css"><link rel="stylesheet" href="/static/css/accessibility.css"><link rel="stylesheet" href="/static/css/compact.css">
<style>
.home-shell{max-width:700px}.compact-hero{padding:18px 20px;margin:0 0 10px}.compact-hero h1{font-size:clamp(2rem,7vw,3rem);margin:0 0 4px}.compact-hero p{margin:0;color:var(--muted)}.quick-tools{display:flex;justify-content:flex-end;gap:8px;margin:0 0 10px}.quick-tools button{width:auto;min-height:40px;padding:8px 12px}.home-auth{display:grid;gap:10px}.home-auth>.card{margin:0}.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.home-actions .text-link{grid-column:1/-1;text-align:center;padding:7px}.home-panel[hidden],.qr-panel[hidden]{display:none!important}.panel-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}.qr-reader-wrap{margin-top:10px;padding:6px;border-radius:12px;background:#080d18;min-height:220px;display:grid;place-items:center}#qr-reader{width:100%;overflow:hidden;border-radius:10px}#qr-reader video{display:block;width:100%;border-radius:10px}.qr-status{margin:8px 0;color:var(--muted);text-align:center}.qr-manual-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.qr-manual-row button{width:auto;min-width:90px}@media(max-width:640px){main.home-shell{width:min(100% - 20px,700px)}.quick-tools{justify-content:stretch}.quick-tools button{flex:1}.home-actions,.panel-actions,.qr-manual-row{grid-template-columns:1fr}.home-actions .text-link{grid-column:auto}.panel-actions .secondary,.qr-manual-row button{width:100%}}
</style>
</head>
<body>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<main id="conteudo" class="home-shell">
<header class="hero compact-hero"><span class="eyebrow">Poesia • Arte • Tecnologia • Inclusão</span><h1>Trilhas Poéticas</h1><p>Experiência gamificada do IFMT.</p></header>
<div class="quick-tools" aria-label="Áudio e acessibilidade"><button id="readPageQuick" type="button" class="secondary compact">Ouvir tela</button><button id="openAccessibilityQuick" type="button" class="secondary compact">Acessibilidade</button></div>
<div id="message" class="notice hidden" role="status" aria-live="polite"></div>
<section id="profile" class="card profile-card hidden" aria-live="polite"></section>
<section id="forms" class="home-auth">
<section id="loginSection" class="card auth-card"><h2>Entrar</h2><form id="loginForm"><label for="login_nick">Nick</label><input id="login_nick" name="nick" autocomplete="username" required minlength="3" maxlength="24"><label for="login_pin">PIN</label><input id="login_pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required placeholder="••••"><button type="submit">Entrar</button></form><div class="home-actions"><button id="showRegister" type="button" class="secondary">Criar conta</button><button id="showRecovery" type="button" class="secondary">Recuperar acesso</button><a class="text-link" href="/ranking">Ranking das equipes</a></div></section>
<section id="registerSection" class="card home-panel" hidden><h2>Criar conta</h2><form id="registerForm"><label for="full_name">Nome completo</label><input id="full_name" name="full_name" autocomplete="name" required minlength="3"><label for="nick">Nick</label><input id="nick" name="nick" autocomplete="username" required minlength="3" maxlength="24"><div class="grid two compact-grid"><div><label for="pin">PIN de 4 dígitos</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required></div><div><label for="pin_confirm">Confirmar PIN</label><input id="pin_confirm" name="pin_confirm" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required></div></div><label for="participant_type">Participante</label><select id="participant_type" name="participant_type" required><option value="student">Aluno IFMT</option><option value="staff">Servidor IFMT</option><option value="external">Público externo</option></select><div id="studentFields"><label for="registration">Matrícula</label><input id="registration" name="registration"><label for="course_class">Curso / turma</label><input id="course_class" name="course_class"></div><div id="externalFields" class="hidden"><label for="institution">Instituição / empresa <span class="muted">(opcional)</span></label><input id="institution" name="institution"></div><div class="panel-actions"><button type="submit">Criar conta</button><button id="backFromRegister" type="button" class="secondary">Voltar</button></div></form></section>
<section id="recoverSection" class="card home-panel" hidden><h2>Recuperar acesso</h2><form id="recoverForm"><label for="access_code">Código de recuperação</label><input id="access_code" name="access_code" required><div class="grid two compact-grid"><div><label for="recovery_pin">Novo PIN</label><input id="recovery_pin" name="new_pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div><div><label for="recovery_pin_confirm">Confirmar PIN</label><input id="recovery_pin_confirm" name="new_pin_confirm" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div></div><div class="panel-actions"><button type="submit">Redefinir PIN</button><button id="backFromRecovery" type="button" class="secondary">Voltar</button></div></form></section>
</section>
<section id="qrScannerSection" class="card qr-panel" hidden><h2>Ler QR Code</h2><p class="muted">A câmera nativa do celular é a opção mais rápida. O leitor abaixo é uma alternativa.</p><div class="qr-reader-wrap"><div id="qr-reader" aria-label="Câmera para leitura do QR Code"></div></div><p id="qrStatus" class="qr-status" role="status" aria-live="polite">Preparando câmera…</p><form id="qrManualForm" class="qr-manual-row"><div><label for="qrManualCode">Código do QR</label><input id="qrManualCode" name="code" maxlength="100" required></div><button type="submit" class="secondary">Abrir</button></form><button id="closeQrScanner" type="button" class="secondary">Fechar câmera</button></section>
</main>
<script src="/static/js/common.js" defer></script><script src="/static/js/index.js" defer></script>
<script defer>
(()=>{const login=document.querySelector('#loginSection'),register=document.querySelector('#registerSection'),recovery=document.querySelector('#recoverSection'),scanner=document.querySelector('#qrScannerSection'),status=document.querySelector('#qrStatus'),reader=document.querySelector('#qr-reader');let stream=null,video=null,detector=null,timer=0,running=false,navigating=false;const panels=[login,register,recovery];function show(panel){panels.forEach(p=>p.hidden=p!==panel);if(panel!==login)panel.scrollIntoView({behavior:'smooth',block:'start'})}document.querySelector('#showRegister').onclick=()=>show(register);document.querySelector('#showRecovery').onclick=()=>show(recovery);document.querySelector('#backFromRegister').onclick=()=>show(login);document.querySelector('#backFromRecovery').onclick=()=>show(login);document.querySelector('#openAccessibilityQuick').onclick=()=>window.openAccessibilityPanel?.();document.querySelector('#readPageQuick').onclick=()=>window.speakPage?.();function codeOf(value){const text=String(value||'').trim();if(!text)return null;try{const u=new URL(text,location.origin),m=u.pathname.match(/^\/q\/([^/?#]+)\/?$/i);if(m)return decodeURIComponent(m[1])}catch(_){}return /^[A-Za-z0-9_-]{2,100}$/.test(text)?text:null}async function stop(){running=false;clearTimeout(timer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(video){video.srcObject=null;video.remove();video=null}reader.replaceChildren()}async function go(value){if(navigating)return;const code=codeOf(value);if(!code){status.textContent='QR inválido.';return}navigating=true;await stop();location.assign(`/q/${encodeURIComponent(code)}`)}async function loop(){if(!running||!video||!detector)return;try{const codes=await detector.detect(video),found=codes.find(x=>x.rawValue);if(found){go(found.rawValue);return}}catch(_){}timer=setTimeout(loop,220)}async function start(){scanner.hidden=false;scanner.scrollIntoView({behavior:'smooth',block:'start'});status.textContent='Abrindo câmera…';if(!('BarcodeDetector' in window)||!navigator.mediaDevices?.getUserMedia){status.textContent='Use a câmera do celular ou digite o código abaixo.';return}try{const formats=await BarcodeDetector.getSupportedFormats();if(!formats.includes('qr_code')){status.textContent='Leitura interna indisponível. Use a câmera do celular ou o código manual.';return}detector=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:540}},audio:false});video=document.createElement('video');video.autoplay=true;video.muted=true;video.playsInline=true;video.srcObject=stream;reader.replaceChildren(video);await video.play();running=true;status.textContent='Câmera ativa.';loop()}catch(_){await stop();status.textContent='Não foi possível abrir a câmera. Digite o código abaixo.'}}document.addEventListener('click',e=>{if(e.target.closest('#openQrScanner'))start();if(e.target.closest('#logoutButton')){stop();scanner.hidden=true;show(login)}});document.querySelector('#closeQrScanner').onclick=async()=>{await stop();scanner.hidden=true};document.querySelector('#qrManualForm').onsubmit=e=>{e.preventDefault();go(new FormData(e.target).get('code'))};document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)stop()});})();
</script>
</body></html>

name: Gamificacao QR - testes

on:
  push:
    paths:
      - 'Projeto-Gamificacao-QR/**'
      - '.github/workflows/gamificacao-qr-tests.yml'
  pull_request:
    paths:
      - 'Projeto-Gamificacao-QR/**'
      - '.github/workflows/gamificacao-qr-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projeto-Gamificacao-QR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Projeto-Gamificacao-QR/requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compilar Python
        run: python -m compileall -q app scripts
      - name: Executar testes
        run: pytest
